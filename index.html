function genAI(){
  if(!wsel || aibusy) return;
  aibusy = true;

  const sp = document.getElementById('aispinner');
  const ta = document.getElementById('rtxt');

  if(sp) sp.style.display = 'flex';
  if(ta) ta.value = '';

  setTimeout(() => {
    const resposta = `Olá! 😊

Recebi sua mensagem${wsel.pac ? ' sobre ' + wsel.pac : ''}.

Vou verificar com calma e te retorno o mais breve possível, tudo bem?

Atenciosamente,  
Dra. Aline`;

    if(ta) ta.value = resposta;
    if(sp) sp.style.display = 'none';

    aibusy = false;
  }, 800);
}

// ==============================
// 📱 WHATSAPP DIRETO
// ==============================
function cpReply(){
  const ta = document.getElementById('rtxt');
  if(!ta || !ta.value) return;

  const numero = prompt("Digite o número com DDD (ex: 5511999999999):");

  if(!numero) return;

  const msg = encodeURIComponent(ta.value);

  const url = `https://wa.me/${numero}?text=${msg}`;

  window.open(url, '_blank');
}

</script>
